name = "lean-weave"
version = "0.1.0"
defaultTargets = ["LeanWeave", "weave", "weave-test"]

[[require]]
name = "lean-net"
git = "https://github.com/isavita/lean-net.git"
rev = "c66fd080b7c748a01cfa72868b05023d5a6c8045"

[[lean_lib]]
name = "LeanWeave"

[[lean_exe]]
name = "weave"
root = "Weave"
needs = ["@/weave-dev-program"]

[[input_file]]
name = "weave-dev-program"
path = "scripts/dev.py"
text = true

[[lean_exe]]
name = "weave-test"
root = "LeanWeave.Test.Main"

[[lean_exe]]
name = "weave-pages"
root = "Examples.Pages"

[[lean_exe]]
name = "weave-forms"
root = "Examples.Forms"

[[lean_exe]]
name = "weave-crud"
root = "Examples.Crud"

[[lean_exe]]
name = "weave-dashboard"
root = "Examples.Dashboard"

[[lean_lib]]
name = "Examples"

[[lean_exe]]
name = "weave-bench"
root = "benchmarks.Main"

[[lean_exe]]
name = "weave-wire-fixture"
root = "LeanWeave.Test.WireFixture"

[[lean_exe]]
name = "weave-static-fixture"
root = "LeanWeave.Test.StaticFixture"
