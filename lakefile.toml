name = "lean-weave"
version = "0.2.0"
defaultTargets = ["LeanWeave", "weave", "weave-test"]

[[require]]
name = "lean-net"
git = "https://github.com/isavita/lean-net.git"
rev = "db114456cf8ad27efb68d967e296e1d2b5efaaf9"

[[lean_lib]]
name = "LeanWeave"

[[lean_exe]]
name = "weave"
root = "Weave"
needs = ["@/weave-dev-program"]

[[input_file]]
name = "weave-dev-program"
path = "scripts/dev.py"
text = true

[[lean_exe]]
name = "weave-test"
root = "LeanWeave.Test.Main"

[[lean_exe]]
name = "weave-pages"
root = "Examples.Pages"

[[lean_exe]]
name = "weave-forms"
root = "Examples.Forms"

[[lean_exe]]
name = "weave-crud"
root = "Examples.Crud"

[[lean_exe]]
name = "weave-dashboard"
root = "Examples.Dashboard"

[[lean_lib]]
name = "Examples"

[[lean_exe]]
name = "weave-bench"
root = "benchmarks.Main"

[[lean_exe]]
name = "weave-wire-fixture"
root = "LeanWeave.Test.WireFixture"

[[lean_exe]]
name = "weave-static-fixture"
root = "LeanWeave.Test.StaticFixture"

[[lean_exe]]
name = "weave-jobs-test"
root = "LeanWeave.Jobs.TestMain"

[[lean_exe]]
name = "weave-platform-test"
root = "LeanWeave.Test.PlatformMain"

[[lean_exe]]
name = "weave-protocol-fixture"
root = "LeanWeave.Test.ProtocolFixture"

[[lean_exe]]
name = "weave-stream-test"
root = "LeanWeave.Test.StreamMain"

[[lean_exe]]
name = "weave-realtime-fixture"
root = "LeanWeave.Test.RealtimeFixture"

[[lean_exe]]
name = "weave-crypto-fixture"
root = "LeanWeave.Test.CryptoFixture"

[[lean_exe]]
name = "weave-graphql-test"
root = "LeanWeave.Test.GraphQLMain"

[[lean_exe]]
name = "weave-graphql-fixture"
root = "LeanWeave.Test.GraphQLFixture"

[[lean_exe]]
name = "weave-platform-bench"
root = "benchmarks.Platform"
