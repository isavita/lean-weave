name: API documentation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_CC: cc
      LEAN_NUM_THREADS: '2'
      DISABLE_EQUATIONS: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install native documentation build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libuv1-dev libssl-dev libpq-dev libcurl4-openssl-dev zlib1g-dev libbrotli-dev pkg-config
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Build API reference
        run: python3 docs/build.py
      - name: Verify public package reference
        run: |
          test -s docs/.lake/build/doc/LeanWeaveDocs.html
          test -s docs/.lake/build/doc/LeanWeave/Core/Static.html
          test -s docs/.lake/build/doc/LeanWeave.html
          test -s docs/.lake/build/doc/LeanNet/HTTP/ReactorServer.html
          test -s docs/.lake/build/doc/LeanNet/AtomicFlag.html
          test -s docs/.lake/build/doc/LeanWeave/Router/Runtime.html
          test -s docs/.lake/build/doc/LeanWeave/Html/Template.html
          test -s docs/.lake/build/doc/LeanWeave/Cache/Response.html
          test -s docs/.lake/build/doc/LeanWeave/Session/Store.html
          test -s docs/.lake/build/doc/LeanWeave/Middleware/Basic.html
          test -s docs/.lake/build/doc/LeanWeavePostgres/Pool.html
          test -s docs/.lake/build/doc/LeanWeaveRedis/Client.html
          test -s docs/.lake/build/doc/LeanWeaveRedis/Cache.html
          test -s docs/.lake/build/doc/LeanWeaveTLS.html
          test -s docs/.lake/build/doc/LeanWeave/Realtime/PubSub.html
          test -s docs/.lake/build/doc/LeanWeave/Presence.html
          test -s docs/.lake/build/doc/LeanWeave/Jobs/Worker.html
          test -s docs/.lake/build/doc/LeanWeave/Workflow/Local.html
          test -s docs/.lake/build/doc/LeanWeave/Tenant/Sql.html
          test -s docs/.lake/build/doc/LeanWeave/Security/Journal.html
          test -s docs/.lake/build/doc/LeanWeave/Security/Policy.html
          test -s docs/.lake/build/doc/LeanWeave/Observability/Trace.html
          test -s docs/.lake/build/doc/LeanWeave/Plugin/Manager.html
          test -s docs/.lake/build/doc/LeanWeave/Grpc/Service.html
          test -s docs/.lake/build/doc/LeanWeave/GraphQL/Execution.html
          test -s docs/.lake/build/doc/LeanWeave/GraphQL/WebSocket.html
          test -s docs/.lake/build/doc/LeanWeavePostgres/Workflows.html
          test -s docs/.lake/build/doc/LeanWeaveHttp/Vault.html
          test -s docs/.lake/build/doc/LeanWeavePlugins.html
          python3 docs/prepare_site.py
          test -s docs/.lake/build/doc/build-info.json
          touch docs/.lake/build/doc/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.lake/build/doc

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy API reference
        id: deployment
        uses: actions/deploy-pages@v4
